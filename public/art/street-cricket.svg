    <circle cx="-38" cy="2" r="7" fill="#eaffc9" opacity="0.85" filter="url(#scGlow)"/>
    <circle cx="38" cy="2" r="7" fill="#eaffc9" opacity="0.85" filter="url(#scGlow)"/>
    <path d="M-42 8 L-96 230 M46 8 L96 230" stroke="#eaffc9" stroke-opacity="0.1" stroke-width="40" filter="url(#scSoft)"/>
