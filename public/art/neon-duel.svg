    <path d="M0 300 H640 M0 320 H640 M0 344 H640 M0 372 H640"/>
  </g>
  <ellipse cx="320" cy="356" rx="190" ry="26" fill="none" stroke="#38e8ff" stroke-opacity=".55" stroke-width="2.5" stroke-dasharray="10 8"/>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" font-weight="700" letter-spacing="1.6">
