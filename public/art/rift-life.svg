<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Rift Life town key art: small lit houses and a workshop along a canal at dusk, townspeople under warm lamps and three day markers above the town">
  <defs>
    <linearGradient id="rl-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1024"/><stop offset=".5" stop-color="#232044"/><stop offset="1" stop-color="#4b3a52"/></linearGradient>
    <linearGradient id="rl-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25324f"/><stop offset="1" stop-color="#101627"/></linearGradient>
    <linearGradient id="rl-house" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2647"/><stop offset="1" stop-color="#161328"/></linearGradient>
    <linearGradient id="rl-window" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe6a3"/><stop offset="1" stop-color="#ffb84d"/></linearGradient>
    <radialGradient id="rl-lamp" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd88a" stop-opacity=".85"/><stop offset="1" stop-color="#ffd88a" stop-opacity="0"/></radialGradient>
    <filter id="rl-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="rl-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

  <rect width="640" height="400" fill="url(#rl-sky)"/>
