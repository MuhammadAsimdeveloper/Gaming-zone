    <circle cx="0" cy="0" r="52" fill="none" stroke="#7fb3d9" stroke-opacity="0.3" stroke-width="1.5"/>
    <path d="M0 -52 A52 52 0 0 1 44 28" fill="none" stroke="#38e8ff" stroke-width="4" stroke-linecap="round"/>
    <g stroke="#7fb3d9" stroke-width="2" opacity="0.7">
      <path d="M0 -46 V-40 M0 46 V40 M-46 0 H-40 M46 0 H40"/>
      <path d="M-33 -33 L-29 -29 M33 33 L29 29 M33 -33 L29 -29 M-33 33 L-29 29"/>
    </g>
    <path d="M0 0 V-28" stroke="#eaf6ff" stroke-width="4" stroke-linecap="round"/>
    <path d="M0 0 L22 14" stroke="#38e8ff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="0" r="5" fill="#eaf6ff"/>
    <rect x="-14" y="-84" width="28" height="12" rx="4" fill="#0b1526" stroke="#38e8ff" stroke-opacity="0.6" stroke-width="2"/>
  </g>

  <g transform="translate(668 268)">
    <circle cx="-40" cy="0" r="11" fill="#ffe08a" opacity="0.9"/>
    <circle cx="0" cy="0" r="11" fill="#dce7f5" opacity="0.85"/>
    <circle cx="40" cy="0" r="11" fill="#e79a5b" opacity="0.85"/>
    <path d="M-40 -4 L-40 4 M-44 0 H-36 M-3 -3 L3 3 M3 -3 L-3 3 M36 -3 H44 M40 4 V-4" stroke="#06111f" stroke-width="1.6" stroke-linecap="round"/>
