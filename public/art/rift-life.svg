  </g>
  <circle cx="536" cy="112" r="60" fill="url(#rl-lamp)" opacity=".5"/>

  <text x="34" y="56" fill="#fff4dd" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">Rift Life</text>
  <text x="34" y="82" fill="#c9b28f" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="2.6">TWENTY-ONE DAYS · THREE BLOCKS · ONE TOWN</text>

  <g transform="translate(36 104)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" letter-spacing="1.6" fill="#ffcf6b">
