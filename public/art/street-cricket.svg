  <text x="44" y="72" fill="#f2fffa" font-family="ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="700">Street Cricket</text>
  <text x="46" y="100" fill="#8fd9c6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="3">SIX BALLS · ONE ROOFTOP · TIMING OVER STATISTICS</text>

