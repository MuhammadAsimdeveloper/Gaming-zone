  <text x="604" y="306" fill="#7fb3d9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2">AUTHOR · GOLD · SILVER · BRONZE</text>
  <text x="44" y="474" fill="#5b7ea3" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" letter-spacing="2.4">PERSONAL BESTS AND GHOSTS STAY IN THIS BROWSER</text>
</svg>
