    <path d="M240 260 V330 H500" stroke-opacity=".6"/>
  </g>
  <g fill="#4c8dff" filter="url(#g)">
    <circle cx="240" cy="160" r="10"/><circle cx="400" cy="260" r="10"/><circle cx="500" cy="330" r="8"/>
  </g>
  <g transform="translate(80 190)" filter="url(#g)">
    <rect x="0" y="0" width="44" height="70" rx="8" fill="#0b1a2c" stroke="#4c8dff" stroke-opacity=".5"/>
    <path d="M22 10 C10 30 8 40 8 46 A14 14 0 0 0 36 46 C36 40 34 30 22 10 Z" fill="#4c8dff" opacity=".7"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="46" fill="#eaf6ff" font-size="30" font-weight="700">Aqua Grid</text>
    <text x="40" y="70" fill="#8faac9" font-size="12" letter-spacing="2.4">PUMPS · PIPES · RESERVOIR</text>
    <text x="460" y="352" fill="#4c8dff" font-size="11" letter-spacing="1.2">RESERVOIR 60</text>
  </g>
