<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Skyport control tower and runway">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#040814" />
      <stop offset="0.55" stop-color="#07162b" />
      <stop offset="1" stop-color="#081222" />
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0" />
      <stop offset="0.5" stop-color="#4c8dff" stop-opacity="0.35" />
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" />
  <g fill="#dfefff">
    <circle cx="70" cy="60" r="1.3" opacity="0.7" />
    <circle cx="190" cy="40" r="1" opacity="0.5" />
    <circle cx="480" cy="50" r="1.4" opacity="0.7" />
    <circle cx="580" cy="80" r="1" opacity="0.6" />
  </g>
  <path d="M0 300 L640 250 V400 H0 Z" fill="#06101e" />
  <path d="M60 400 L280 300 H600 L380 400 Z" fill="#0a1628" />
  <g stroke="#4c8dff" stroke-opacity="0.4" stroke-width="2" fill="none">
    <path d="M220 312 H520" />
    <path d="M210 330 H540" />
    <path d="M200 350 H560" />
    <path d="M190 372 H580" />
  </g>
  <path d="M300 400 L330 300" stroke="#eaffff" stroke-opacity="0.35" stroke-width="3" stroke-dasharray="12 14" />
  <g filter="url(#glow)">
    <rect x="150" y="150" width="60" height="170" fill="#0d1930" stroke="#4c8dff" stroke-opacity="0.4" />
    <rect x="130" y="136" width="100" height="34" rx="8" fill="#10223f" stroke="#4c8dff" stroke-opacity="0.6" />
    <rect x="142" y="142" width="76" height="18" rx="4" fill="#9cc0ff" opacity="0.45" />
    <path d="M200 170 L560 60 L600 120 L230 210 Z" fill="url(#beam)" />
  </g>
  <g transform="translate(420 180) rotate(-12)" filter="url(#glow)">
    <path d="M0 20 L56 0 L90 8 L56 20 L70 34 L52 34 L38 24 L10 30 Z" fill="#dff2ff" opacity="0.9" />
    <path d="M52 6 L74 12" stroke="#4c8dff" stroke-width="3" />
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="46" fill="#eaf6ff" font-size="30" font-weight="700">Skyport</text>
    <text x="40" y="70" fill="#8faac9" font-size="12" letter-spacing="2.4">GATES · RUNWAYS · CREW</text>
    <g fill="#9cc0ff" font-size="11" letter-spacing="1.2">
      <text x="470" y="352">SLOTS 06 / 12</text>
    </g>
  </g>
