<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Hoop Circuit neon arena with a floating basketball arcing toward a glowing rim">
  <defs>
    <linearGradient id="hoop-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03060f"/><stop offset="1" stop-color="#08132c"/></linearGradient>
    <linearGradient id="hoop-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#123049"/><stop offset="1" stop-color="#050c18"/></linearGradient>
    <radialGradient id="hoop-ball" cx="0.35" cy="0.3" r="0.8"><stop offset="0" stop-color="#ffd9a3"/><stop offset="0.55" stop-color="#ff9f43"/><stop offset="1" stop-color="#c25a12"/></radialGradient>
    <linearGradient id="hoop-board" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9fccff" stop-opacity=".3"/><stop offset="1" stop-color="#4c8dff" stop-opacity=".12"/></linearGradient>
    <filter id="hoop-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="640" height="400" fill="url(#hoop-bg)"/>
  <circle cx="520" cy="70" r="150" fill="#b285ff" opacity=".10"/>
  <circle cx="150" cy="150" r="120" fill="#4c8dff" opacity=".10"/>

  <g opacity=".65">
    <circle cx="70" cy="58" r="3" fill="#4c8dff"/><circle cx="128" cy="42" r="2.4" fill="#b285ff"/><circle cx="196" cy="60" r="2.6" fill="#69f0ff"/><circle cx="268" cy="38" r="2.2" fill="#4ade9d"/>
    <circle cx="352" cy="56" r="2.8" fill="#ffb347"/><circle cx="428" cy="40" r="2.2" fill="#69f0ff"/><circle cx="500" cy="58" r="2.6" fill="#b285ff"/><circle cx="574" cy="44" r="2.4" fill="#4c8dff"/>
    <circle cx="96" cy="80" r="2" fill="#4ade9d"/><circle cx="232" cy="84" r="2.2" fill="#4c8dff"/><circle cx="388" cy="82" r="2" fill="#b285ff"/><circle cx="548" cy="80" r="2.2" fill="#69f0ff"/>
  </g>

  <text x="40" y="62" fill="#f5f7ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">Hoop Circuit</text>
  <text x="40" y="88" fill="#8fa9d6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="2.6">SIXTY SECONDS · FOUR SPOTS</text>

  <path d="M0 282 H640 V400 H0 Z" fill="url(#hoop-floor)"/>
  <path d="M0 282 H640" stroke="#4ade9d" stroke-opacity=".5" stroke-width="2"/>
  <path d="M320 282 C 210 282 150 240 150 176" fill="none" stroke="#4ade9d" stroke-opacity=".35" stroke-width="2" stroke-dasharray="7 7"/>
  <rect x="300" y="212" width="200" height="70" fill="none" stroke="#69f0ff" stroke-opacity=".25" stroke-width="2"/>

  <g filter="url(#hoop-glow)">
    <rect x="470" y="96" width="84" height="112" rx="6" fill="url(#hoop-board)" stroke="#dcecff" stroke-opacity=".5"/>
    <rect x="494" y="158" width="36" height="26" fill="none" stroke="#ff6b6b" stroke-opacity=".75" stroke-width="2"/>
    <path d="M486 176 H538" stroke="#ff8a3d" stroke-width="6" stroke-linecap="round"/>
  </g>
  <path d="M486 178 L496 214 M512 178 L510 218 M528 178 L524 214 M538 178 L518 220" stroke="#dcecff" stroke-opacity=".5" stroke-width="1.4"/>
  <path d="M492 196 H536" stroke="#dcecff" stroke-opacity=".3" stroke-width="1.2"/>
  <path d="M496 208 H530" stroke="#dcecff" stroke-opacity=".22" stroke-width="1.2"/>
  <path d="M512 96 V70 H600 V282" fill="none" stroke="#8fb6ff" stroke-opacity=".45" stroke-width="7" stroke-linejoin="round"/>

  <path d="M118 300 C 190 150 330 116 470 172" fill="none" stroke="#69f0ff" stroke-opacity=".55" stroke-width="2" stroke-dasharray="3 10" stroke-linecap="round"/>

  <g transform="translate(118 300)">
    <ellipse cx="0" cy="8" rx="30" ry="7" fill="#000" opacity=".35"/>
    <path d="M-9 0 L-20 -46 M9 0 L22 -42" stroke="#0d1730" stroke-width="12" stroke-linecap="round"/>
    <rect x="-19" y="-86" width="38" height="44" rx="9" fill="#4ade9d"/>
    <rect x="-15" y="-78" width="30" height="8" rx="3" fill="#0f6b4a"/>
    <path d="M-16 -80 L-32 -104 M16 -80 L30 -102" stroke="#4ade9d" stroke-width="10" stroke-linecap="round"/>
    <circle cx="0" cy="-102" r="13" fill="#ffcf9f"/>
    <path d="M-13 -106 A13 13 0 0 1 13 -106 Z" fill="#0d1730"/>
  </g>

  <g transform="translate(356 150)">
    <circle r="26" fill="url(#hoop-ball)"/>
    <circle r="26" fill="none" stroke="#5c2a08" stroke-width="2.4"/>
    <ellipse rx="10" ry="26" fill="none" stroke="#5c2a08" stroke-width="2"/>
    <path d="M-26 0 H26" stroke="#5c2a08" stroke-width="2"/>
  </g>

  <text x="452" y="316" fill="#8fa9d6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2">SWISH +3 · STREAK ×3</text>
  <rect x="40" y="352" width="120" height="6" rx="3" fill="#4c8dff" opacity=".7"/>
  <rect x="172" y="352" width="58" height="6" rx="3" fill="#b285ff" opacity=".6"/>
  <rect x="242" y="352" width="26" height="6" rx="3" fill="#69f0ff" opacity=".5"/>
