  <g transform="translate(322 226)" filter="url(#duel-glow)">
    <g stroke="#ffd166" stroke-width="4" stroke-linecap="round">
      <path d="M0 -18 L0 -40"/><path d="M17 -10 L30 -27"/><path d="M-17 -10 L-30 -27"/><path d="M22 4 L42 2"/><path d="M-22 4 L-42 2"/><path d="M14 18 L24 34"/><path d="M-14 18 L-24 34"/>
