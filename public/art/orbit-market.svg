      <stop offset="0" stop-color="#080512" />
      <stop offset="0.55" stop-color="#160d2c" />
      <stop offset="1" stop-color="#070b1a" />
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b285ff" />
      <stop offset="1" stop-color="#4c8dff" />
    </linearGradient>
    <radialGradient id="planet" cx="0.4" cy="0.35" r="0.65">
      <stop offset="0" stop-color="#3a4b8a" />
      <stop offset="1" stop-color="#0b1024" />
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" />
  <g fill="#f2eaff">
    <circle cx="80" cy="70" r="1.4" opacity="0.8" />
    <circle cx="200" cy="48" r="1.1" opacity="0.6" />
