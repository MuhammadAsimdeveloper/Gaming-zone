    <rect x="-62" y="-4" width="26" height="16" rx="3" fill="#102f34" stroke="#5ef2c0" stroke-opacity="0.7" stroke-width="2"/>
    <rect x="36" y="-4" width="26" height="16" rx="3" fill="#102f34" stroke="#5ef2c0" stroke-opacity="0.7" stroke-width="2"/>
