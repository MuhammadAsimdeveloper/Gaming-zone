<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Aqua Grid water network">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#040814"/><stop offset="1" stop-color="#061b26"/></linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4c8dff"/><stop offset="1" stop-color="#4ade9d"/></linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <g stroke="#4c8dff" stroke-opacity=".15"><path d="M0 120 H640 M0 240 H640 M0 340 H640 M140 0 V400 M320 0 V400 M500 0 V400"/></g>
  <g filter="url(#g)" fill="none" stroke="url(#water)" stroke-width="6">
