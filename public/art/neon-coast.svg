<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Neon Coast key art: Solara Bay at night seen from above, with a mint promenade along a coral-lit waterfront, two palm trees, a single teal coupe on the road and a glowing route marker">
  <defs>
    <linearGradient id="nc-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b1024"/><stop offset=".6" stop-color="#122043"/><stop offset="1" stop-color="#1b2c4d"/></linearGradient>
    <linearGradient id="nc-sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e3a4d"/><stop offset="1" stop-color="#071c2b"/></linearGradient>
    <linearGradient id="nc-road" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1c2740"/><stop offset="1" stop-color="#131a2c"/></linearGradient>
    <linearGradient id="nc-sand" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3d3a4f"/><stop offset="1" stop-color="#252236"/></linearGradient>
    <radialGradient id="nc-moon" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff6d8"/><stop offset=".65" stop-color="#ffe9a8" stop-opacity=".85"/><stop offset="1" stop-color="#ffe9a8" stop-opacity="0"/></radialGradient>
    <radialGradient id="nc-glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7ef0c1" stop-opacity=".55"/><stop offset="1" stop-color="#7ef0c1" stop-opacity="0"/></radialGradient>
    <filter id="nc-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7"/></filter>
    <filter id="nc-lamp" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="640" height="400" fill="url(#nc-sky)"/>
  <circle cx="520" cy="74" r="52" fill="url(#nc-moon)"/>
  <circle cx="520" cy="74" r="20" fill="#fff3cf" opacity=".9"/>

  <g fill="#9db7d6" opacity=".5">
