<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Street Cricket key art: a floodlit rooftop pitch at dusk with a batter, stumps, a fielder and a lofted ball arcing toward the skyline">
  <defs>
    <linearGradient id="scSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04121a"/>
      <stop offset="0.55" stop-color="#07242c"/>
      <stop offset="1" stop-color="#0b3a3a"/>
    </linearGradient>
    <linearGradient id="scRoof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#123f42"/>
      <stop offset="1" stop-color="#071d22"/>
    </linearGradient>
    <linearGradient id="scPitch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c5c55"/>
      <stop offset="1" stop-color="#0e3a38"/>
    </linearGradient>
    <linearGradient id="scArc" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5ef2c0"/>
      <stop offset="1" stop-color="#c9ff6b"/>
    </linearGradient>
    <radialGradient id="scHaze" cx="0.5" cy="0.4" r="0.62">
      <stop offset="0" stop-color="#5ef2c0" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#5ef2c0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="scBall" cx="0.35" cy="0.3" r="0.8">
      <stop offset="0" stop-color="#fff8d8"/>
      <stop offset="1" stop-color="#ffb454"/>
    </radialGradient>
    <filter id="scGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="scSoft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.2"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#scSky)"/>
  <ellipse cx="400" cy="250" rx="440" ry="250" fill="url(#scHaze)"/>

  <g opacity="0.55" fill="#0a2b33">
