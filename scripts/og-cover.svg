<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="NeonRift — free browser games, instant play">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050814"/>
      <stop offset="0.55" stop-color="#0a1122"/>
      <stop offset="1" stop-color="#0e172c"/>
    </linearGradient>
    <linearGradient id="mark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4c8dff"/>
      <stop offset="1" stop-color="#a06bff"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eef2ff"/>
      <stop offset="0.62" stop-color="#9cc0ff"/>
      <stop offset="1" stop-color="#cbb0ff"/>
    </linearGradient>
    <radialGradient id="glowBlue" cx="0.15" cy="0.2" r="0.7">
      <stop offset="0" stop-color="#4c8dff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#4c8dff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPlasma" cx="0.85" cy="0.75" r="0.7">
      <stop offset="0" stop-color="#a06bff" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#a06bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glowBlue)"/>
  <rect width="1200" height="630" fill="url(#glowPlasma)"/>

  <g opacity="0.16" stroke="#93a1bd" stroke-width="1">
    <path d="M0 90h1200M0 180h1200M0 270h1200M0 360h1200M0 450h1200M0 540h1200"/>
    <path d="M100 0v630M200 0v630M300 0v630M400 0v630M500 0v630M600 0v630M700 0v630M800 0v630M900 0v630M1000 0v630M1100 0v630"/>
  </g>

  <g transform="translate(88 110)">
    <rect width="104" height="104" rx="26" fill="url(#mark)"/>
    <path d="M30 76L74 30" stroke="#ffffff" stroke-opacity="0.22" stroke-width="16" stroke-linecap="round"/>
    <path d="M40 28L78 52L40 76Z" fill="#ffffff"/>
  </g>

  <text x="216" y="190" font-family="Segoe UI, Arial, sans-serif" font-size="86" font-weight="700" fill="url(#word)" letter-spacing="-2">NeonRift</text>
  <text x="90" y="300" font-family="Segoe UI, Arial, sans-serif" font-size="31" font-weight="600" fill="#93a1bd">Free browser games. Instant play.</text>
  <text x="90" y="356" font-family="Segoe UI, Arial, sans-serif" font-size="21" fill="#93a1bd" opacity="0.85">Arcade · Puzzle · Racing · Strategy</text>

  <g transform="translate(90 430)">
    <rect width="300" height="58" rx="29" fill="#4c8dff" fill-opacity="0.14" stroke="#4c8dff" stroke-opacity="0.35"/>
    <text x="150" y="37" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#9cc0ff">No downloads · No account</text>
  </g>
  <g transform="translate(410 430)">
    <rect width="250" height="58" rx="29" fill="#4ade9d" fill-opacity="0.1" stroke="#4ade9d" stroke-opacity="0.3"/>
    <text x="125" y="37" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="20" font-weight="600" fill="#4ade9d">10 original games</text>
  </g>

  <g transform="translate(760 96)" opacity="0.95">
    <rect x="0" y="0" width="348" height="220" rx="24" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.14"/>
    <rect x="20" y="20" width="308" height="122" rx="14" fill="#050814" stroke="#ffffff" stroke-opacity="0.08"/>
    <path d="M122 58l64 34-64 34z" fill="#6ba4ff"/>
    <rect x="20" y="160" width="170" height="12" rx="6" fill="#eef2ff" fill-opacity="0.55"/>
    <rect x="20" y="184" width="110" height="10" rx="5" fill="#93a1bd" fill-opacity="0.4"/>
    <rect x="260" y="160" width="68" height="34" rx="17" fill="#a06bff" fill-opacity="0.2" stroke="#a06bff" stroke-opacity="0.45"/>
    <text x="294" y="184" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="14" font-weight="600" fill="#cbb0ff">Play</text>
  </g>
  <g transform="translate(826 350)" opacity="0.8">
    <rect x="0" y="0" width="282" height="178" rx="22" fill="url(#card)" stroke="#ffffff" stroke-opacity="0.12"/>
    <circle cx="70" cy="70" r="28" fill="#ff6b81" fill-opacity="0.25" stroke="#ff6b81" stroke-opacity="0.5"/>
    <circle cx="142" cy="70" r="28" fill="#4ade9d" fill-opacity="0.2" stroke="#4ade9d" stroke-opacity="0.45"/>
    <circle cx="214" cy="70" r="28" fill="#a06bff" fill-opacity="0.22" stroke="#a06bff" stroke-opacity="0.45"/>
    <rect x="24" y="128" width="150" height="11" rx="5.5" fill="#eef2ff" fill-opacity="0.45"/>
    <rect x="24" y="150" width="96" height="9" rx="4.5" fill="#93a1bd" fill-opacity="0.35"/>
  </g>

  <circle cx="700" cy="80" r="90" fill="#4c8dff" fill-opacity="0.12" filter="url(#soft)"/>
  <circle cx="1080" cy="560" r="110" fill="#a06bff" fill-opacity="0.12" filter="url(#soft)"/>
</svg>
