    <circle cx="602" cy="58" r="1.2"/>
  </g>

  <path d="M0 214 H640 V400 H0 Z" fill="url(#nc-sea)"/>
  <g stroke="#7ef0c1" stroke-opacity=".28" stroke-width="2" fill="none">
