<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Neon Rush three-lane endless runner with a glowing corridor">
  <defs>
    <linearGradient id="rush-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03060f"/><stop offset="1" stop-color="#0a1430"/></linearGradient>
    <linearGradient id="rush-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#101c3a"/><stop offset="1" stop-color="#060b1a"/></linearGradient>
    <linearGradient id="rush-suit" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f4f7ff"/><stop offset="1" stop-color="#a9bde6"/></linearGradient>
    <linearGradient id="rush-train" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1b2a52"/><stop offset="1" stop-color="#0a122a"/></linearGradient>
    <filter id="rush-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="640" height="400" fill="url(#rush-bg)"/>
  <circle cx="520" cy="70" r="130" fill="#4c8dff" opacity=".10"/>
  <circle cx="110" cy="300" r="120" fill="#b285ff" opacity=".10"/>

  <text x="40" y="64" fill="#f5ecff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">Neon Rush</text>
  <text x="40" y="90" fill="#8fa9d6" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="2.6">THREE LANES · ONE RUNNER</text>

  <g transform="translate(320 210)">
    <path d="M-150 150 L-28 -60 L28 -60 L150 150 Z" fill="url(#rush-floor)"/>
    <path d="M-150 150 L-28 -60 M-100 150 L-14 -60 M100 150 L14 -60 M150 150 L28 -60" stroke="#2d6bff" stroke-opacity=".55" stroke-width="2"/>
    <path d="M-150 150 L-28 -60 M150 150 L28 -60" stroke="#b285ff" stroke-width="2.5" filter="url(#rush-glow)"/>
    <path d="M-120 150 L-22 -60 M120 150 L22 -60" stroke="#69f0ff" stroke-opacity=".4" stroke-width="1.5"/>
    <g stroke="#4c8dff" stroke-opacity=".55" stroke-width="2">
      <path d="M-130 140 L-88 90"/><path d="M-96 80 L-62 26"/><path d="M78 120 L54 84"/>
    </g>
    <g fill="#69f0ff" filter="url(#rush-glow)">
      <path d="M-52 44 L-46 58 L-52 72 L-58 58 Z"/>
      <path d="M46 20 L52 32 L46 44 L40 32 Z"/>
      <path d="M-4 72 L2 84 L-4 96 L-10 84 Z"/>
    </g>
    <g transform="translate(0 118)">
      <ellipse cx="0" cy="40" rx="34" ry="7" fill="#4c8dff" opacity=".28"/>
      <rect x="-17" y="-38" width="34" height="44" rx="8" fill="url(#rush-suit)"/>
      <rect x="-13" y="-30" width="26" height="8" rx="3" fill="#4c8dff" filter="url(#rush-glow)"/>
      <rect x="-17" y="2" width="13" height="34" rx="5" fill="#141a2c"/>
      <rect x="4" y="2" width="13" height="34" rx="5" fill="#141a2c"/>
      <rect x="-29" y="-34" width="11" height="30" rx="5" fill="url(#rush-suit)"/>
      <rect x="18" y="-34" width="11" height="30" rx="5" fill="url(#rush-suit)"/>
      <circle cx="0" cy="-50" r="12" fill="#ffcf9f"/>
      <rect x="-10" y="-55" width="20" height="7" rx="3" fill="#4c8dff" filter="url(#rush-glow)"/>
    </g>
    <g transform="translate(-92 12)">
      <rect x="-30" y="-46" width="60" height="64" rx="8" fill="url(#rush-train)" stroke="#4c8dff" stroke-opacity=".5"/>
      <rect x="-22" y="-34" width="44" height="18" rx="4" fill="#4c8dff" opacity=".75" filter="url(#rush-glow)"/>
      <circle cx="-16" cy="26" r="4" fill="#ff6b6b"/>
      <circle cx="16" cy="26" r="4" fill="#ff6b6b"/>
    </g>
    <g transform="translate(96 -6)">
      <rect x="-24" y="-6" width="48" height="10" rx="4" fill="#ff6b6b" filter="url(#rush-glow)"/>
      <rect x="-24" y="-30" width="6" height="30" fill="#b285ff"/>
      <rect x="18" y="-30" width="6" height="30" fill="#b285ff"/>
      <rect x="-26" y="-34" width="52" height="5" rx="2" fill="#b285ff" filter="url(#rush-glow)"/>
    </g>
  </g>

  <rect x="40" y="352" width="120" height="6" rx="3" fill="#4c8dff" opacity=".7"/>
  <rect x="172" y="352" width="58" height="6" rx="3" fill="#b285ff" opacity=".6"/>
  <rect x="242" y="352" width="26" height="6" rx="3" fill="#69f0ff" opacity=".5"/>
</svg>
