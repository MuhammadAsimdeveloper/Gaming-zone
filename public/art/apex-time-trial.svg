<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Apex Time Trial key art: a glowing circuit loop with checkpoint gates, a start gantry and a stopwatch">
  <defs>
    <linearGradient id="attSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#03060f"/>
      <stop offset="0.6" stop-color="#071127"/>
      <stop offset="1" stop-color="#0d1b36"/>
    </linearGradient>
    <linearGradient id="attRoad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#16233f"/>
      <stop offset="1" stop-color="#080f1f"/>
    </linearGradient>
    <linearGradient id="attCurb" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38e8ff"/>
      <stop offset="1" stop-color="#a06bff"/>
    </linearGradient>
    <linearGradient id="attCar" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8fe9ff"/>
      <stop offset="0.5" stop-color="#38e8ff"/>
      <stop offset="1" stop-color="#1f6fbf"/>
    </linearGradient>
    <radialGradient id="attHaze" cx="0.5" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#38e8ff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#38e8ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="attClock" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#0f2a3d"/>
      <stop offset="1" stop-color="#06111f"/>
    </radialGradient>
    <filter id="attGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#attSky)"/>
  <ellipse cx="420" cy="260" rx="430" ry="250" fill="url(#attHaze)"/>

  <g opacity="0.5" fill="#0d1b36">
    <rect x="24" y="170" width="64" height="190"/>
    <rect x="98" y="132" width="48" height="228"/>
    <rect x="156" y="200" width="58" height="160"/>
    <rect x="632" y="158" width="60" height="202"/>
    <rect x="702" y="188" width="50" height="172"/>
    <rect x="760" y="146" width="40" height="214"/>
  </g>
  <g fill="#38e8ff" opacity="0.4">
    <rect x="34" y="188" width="8" height="4"/>
    <rect x="108" y="150" width="8" height="4"/>
    <rect x="166" y="218" width="8" height="4"/>
    <rect x="642" y="176" width="8" height="4"/>
    <rect x="712" y="206" width="8" height="4"/>
  </g>

  <text x="44" y="74" fill="#f5f7ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="38" font-weight="700">Apex Time Trial</text>
  <text x="46" y="102" fill="#7fb3d9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="3">ONE MACHINE · THREE CIRCUITS · THE CLOCK</text>

  <g opacity="0.16" stroke="#5eead4" stroke-width="1.4">
    <path d="M44 122 H300 M44 134 H260 M44 146 H220"/>
  </g>

  <path
    d="M120 420 C40 372 48 292 128 258 C196 228 268 262 312 226 C356 190 340 118 408 100 C486 80 574 122 604 186 C634 250 600 322 540 348 C476 376 402 344 352 372 C302 400 238 452 164 442 C144 439 130 430 120 420 Z"
    fill="none"
    stroke="url(#attCurb)"
    stroke-width="34"
    stroke-linejoin="round"
    opacity="0.9"
  />
  <path
    d="M120 420 C40 372 48 292 128 258 C196 228 268 262 312 226 C356 190 340 118 408 100 C486 80 574 122 604 186 C634 250 600 322 540 348 C476 376 402 344 352 372 C302 400 238 452 164 442 C144 439 130 430 120 420 Z"
    fill="none"
    stroke="url(#attRoad)"
    stroke-width="24"
    stroke-linejoin="round"
  />
  <path
    d="M120 420 C40 372 48 292 128 258 C196 228 268 262 312 226 C356 190 340 118 408 100 C486 80 574 122 604 186 C634 250 600 322 540 348 C476 376 402 344 352 372 C302 400 238 452 164 442 C144 439 130 430 120 420 Z"
    fill="none"
    stroke="#eaf6ff"
    stroke-width="1.6"
    stroke-dasharray="10 18"
    opacity="0.7"
  />

  <g filter="url(#attGlow)">
    <circle cx="312" cy="226" r="7" fill="#ffe08a"/>
    <circle cx="540" cy="348" r="7" fill="#ffe08a"/>
  </g>
  <g stroke="#ffe08a" stroke-width="3" stroke-linecap="round">
    <path d="M300 214 V182 M300 182 H324 M312 214 V196"/>
    <path d="M528 336 V304 M528 304 H552 M540 336 V318"/>
