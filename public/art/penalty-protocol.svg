<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Penalty Protocol night shootout with a glowing goal and diving keeper">
  <defs>
    <linearGradient id="pen-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#03060f"/><stop offset=".6" stop-color="#0a1430"/><stop offset="1" stop-color="#101f42"/></linearGradient>
    <linearGradient id="pen-pitch" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0b3a2a"/><stop offset="1" stop-color="#04120f"/></linearGradient>
    <linearGradient id="pen-net" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#dbe8ff" stop-opacity=".22"/><stop offset="1" stop-color="#8fb4ff" stop-opacity=".06"/></linearGradient>
    <filter id="pen-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="pen-soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter>
  </defs>

