    <rect x="-11" y="-115" width="9" height="3" rx="1.5" fill="#ffd0b8" filter="url(#duel-glow)"/>
    <g stroke="#ffb27a" stroke-opacity=".85" stroke-width="3" filter="url(#duel-glow)">
