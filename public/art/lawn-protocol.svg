<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Lawn Protocol rooftop garden grid with glowing bio-modules holding back a rust swarm from a solar core">
  <defs>
    <linearGradient id="lawn-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#040a08"/><stop offset="1" stop-color="#0a1a14"/></linearGradient>
    <linearGradient id="lawn-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#143526"/><stop offset="1" stop-color="#06120c"/></linearGradient>
    <linearGradient id="lawn-sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe9a8"/><stop offset="1" stop-color="#fbbf24"/></linearGradient>
    <radialGradient id="lawn-core" cx="0.5" cy="0.5" r="0.55"><stop offset="0" stop-color="#fff6cf"/><stop offset="0.55" stop-color="#fbbf24"/><stop offset="1" stop-color="#a16207"/></radialGradient>
    <filter id="lawn-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="5" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>

  <rect width="640" height="400" fill="url(#lawn-bg)"/>
  <circle cx="560" cy="60" r="150" fill="#fbbf24" opacity=".08"/>
  <circle cx="120" cy="120" r="130" fill="#4ade9d" opacity=".07"/>

  <g opacity=".55">
    <circle cx="64" cy="54" r="2.4" fill="#fbbf24"/><circle cx="148" cy="40" r="2" fill="#4ade9d"/><circle cx="228" cy="58" r="2.2" fill="#69f0ff"/><circle cx="308" cy="36" r="2" fill="#fbbf24"/>
    <circle cx="392" cy="52" r="2.4" fill="#4ade9d"/><circle cx="470" cy="38" r="2" fill="#ff8a3d"/><circle cx="548" cy="56" r="2.2" fill="#69f0ff"/><circle cx="600" cy="42" r="2" fill="#fbbf24"/>
  </g>

  <text x="40" y="62" fill="#f5f7ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">Lawn Protocol</text>
  <text x="40" y="88" fill="#8fbfa9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="2.6">GROW THE GRID · HOLD THE LINE</text>

  <path d="M0 250 H640 V400 H0 Z" fill="url(#lawn-floor)"/>
  <path d="M0 250 H640" stroke="#4ade9d" stroke-opacity=".45" stroke-width="2"/>

  <g opacity=".35" stroke="#69f0ff" stroke-width="1.2">
    <path d="M232 250 H640 M232 282 H640 M232 314 H640 M232 346 H640"/>
    <path d="M232 250 L640 366 M292 250 L640 318 M352 250 L640 288 M412 250 L640 264 M472 250 L520 250"/>
  </g>

  <g filter="url(#lawn-glow)">
    <circle cx="196" cy="308" r="34" fill="url(#lawn-core)" opacity=".9"/>
    <circle cx="196" cy="308" r="52" fill="none" stroke="#fbbf24" stroke-opacity=".45" stroke-width="2" stroke-dasharray="4 8"/>
    <path d="M196 278 V338 M166 308 H226" stroke="#fff6cf" stroke-opacity=".8" stroke-width="3" stroke-linecap="round"/>
  </g>
  <text x="160" y="378" fill="#8fbfa9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" letter-spacing="2">SOLAR CORE</text>

  <g transform="translate(300 318)">
    <ellipse cx="0" cy="6" rx="24" ry="6" fill="#000" opacity=".35"/>
    <path d="M0 -2 V-42" stroke="#2f8f63" stroke-width="4" stroke-linecap="round"/>
    <g filter="url(#lawn-glow)">
      <path d="M0 -26 C -26 -30 -34 -52 -20 -62 C -8 -56 -2 -42 0 -26 Z" fill="#4ade9d"/>
      <path d="M0 -26 C 26 -30 34 -52 20 -62 C 8 -56 2 -42 0 -26 Z" fill="#7ef0b6"/>
      <path d="M0 -30 C -8 -52 0 -70 0 -70 C 0 -70 8 -52 0 -30 Z" fill="#b6ffd8"/>
      <circle cx="0" cy="-70" r="7" fill="url(#lawn-sun)"/>
    </g>
  </g>

  <g transform="translate(372 344)">
    <ellipse cx="0" cy="6" rx="22" ry="5" fill="#000" opacity=".3"/>
    <rect x="-14" y="-26" width="28" height="30" rx="6" fill="#3f7f5f" stroke="#b6ffd8" stroke-opacity=".55"/>
    <circle cx="0" cy="-32" r="10" fill="#69f0ff" filter="url(#lawn-glow)"/>
    <path d="M-14 -8 H14" stroke="#0b2016" stroke-width="2"/>
  </g>

  <g transform="translate(470 300)">
    <ellipse cx="0" cy="8" rx="20" ry="5" fill="#000" opacity=".3"/>
    <path d="M-12 0 L-18 -30 L18 -30 L12 0 Z" fill="#6b3a1e" stroke="#ff8a3d" stroke-opacity=".7"/>
    <circle cx="-5" cy="-22" r="2.4" fill="#ffb347"/>
    <circle cx="6" cy="-18" r="2.4" fill="#ffb347"/>
    <path d="M-16 -30 L-22 -40 M16 -30 L22 -40" stroke="#6b3a1e" stroke-width="4" stroke-linecap="round"/>
  </g>

  <g transform="translate(544 332)">
    <ellipse cx="0" cy="8" rx="18" ry="5" fill="#000" opacity=".28"/>
    <path d="M-11 0 L-15 -26 L15 -26 L11 0 Z" fill="#58321c" stroke="#ff6b4a" stroke-opacity=".65"/>
    <circle cx="0" cy="-20" r="2.2" fill="#ffb347"/>
    <path d="M-14 -26 L-19 -34 M14 -26 L19 -34" stroke="#58321c" stroke-width="3.4" stroke-linecap="round"/>
  </g>

  <g transform="translate(604 306)">
    <ellipse cx="0" cy="7" rx="15" ry="4" fill="#000" opacity=".28"/>
    <path d="M-9 0 L-12 -22 L12 -22 L9 0 Z" fill="#6b3a1e" stroke="#ff8a3d" stroke-opacity=".6"/>
    <circle cx="0" cy="-17" r="2" fill="#ffb347"/>
  </g>

  <g filter="url(#lawn-glow)">
    <circle cx="438" cy="262" r="5" fill="#fbbf24"/>
    <circle cx="508" cy="276" r="4" fill="#fbbf24"/>
    <circle cx="264" cy="284" r="4" fill="#fbbf24"/>
  </g>

  <text x="452" y="378" fill="#8fbfa9" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" letter-spacing="2">8 MODULES · 10 RUST TYPES · 12 ROOFS</text>
  <rect x="40" y="352" width="118" height="6" rx="3" fill="#fbbf24" opacity=".7"/>
  <rect x="170" y="352" width="56" height="6" rx="3" fill="#4ade9d" opacity=".65"/>
  <rect x="238" y="352" width="26" height="6" rx="3" fill="#69f0ff" opacity=".5"/>
</svg>
