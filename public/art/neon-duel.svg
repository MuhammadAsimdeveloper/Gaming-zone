    <rect x="132" y="178" width="4" height="4"/><rect x="164" y="206" width="4" height="4"/><rect x="480" y="192" width="4" height="4"/>
  </g>

  <text x="36" y="58" fill="#f6f0ff" font-family="ui-sans-serif, system-ui, sans-serif" font-size="34" font-weight="700">Neon Duel</text>
  <text x="36" y="84" fill="#a294c8" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" letter-spacing="2.6">BEST OF THREE · 60 SECONDS</text>

