    <linearGradient id="re-moss" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#256f8a"/><stop offset="1" stop-color="#7dd3fc"/></linearGradient>
    <radialGradient id="re-shaft" cx=".5" cy="0" r="1"><stop offset="0" stop-color="#bdf6ff" stop-opacity=".25"/><stop offset="1" stop-color="#bdf6ff" stop-opacity="0"/></radialGradient>
    <filter id="re-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="re-soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
  </defs>

