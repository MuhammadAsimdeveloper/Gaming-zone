    <circle cx="-4" cy="-38" r="15" fill="#0b1f26" stroke="#5ef2c0" stroke-opacity="0.65" stroke-width="2"/>
    <rect x="-12" y="-24" width="18" height="46" rx="7" fill="#0e2a30" stroke="#5ef2c0" stroke-opacity="0.55" stroke-width="2"/>
    <path d="M-12 0 L-30 12 M-12 8 L-26 32" stroke="#0e2a30" stroke-width="9" stroke-linecap="round"/>
    <path d="M6 -20 L26 -38 L56 -66" stroke="#c9ff6b" stroke-width="4" stroke-linecap="round" filter="url(#scGlow)"/>
