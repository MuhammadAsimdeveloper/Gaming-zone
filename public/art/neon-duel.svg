  <circle cx="474" cy="78" r="26" fill="#f2e8ff" opacity=".85" filter="url(#duel-glow)"/>

  <g opacity=".5" fill="#0e0f2a">
    <rect x="0" y="170" width="34" height="110"/><rect x="40" y="146" width="26" height="134"/><rect x="74" y="186" width="40" height="94"/>
    <rect x="126" y="162" width="22" height="118"/><rect x="154" y="192" width="34" height="88"/><rect x="470" y="176" width="30" height="104"/>
    <rect x="506" y="150" width="24" height="130"/><rect x="538" y="188" width="38" height="92"/><rect x="586" y="164" width="26" height="116"/><rect x="618" y="196" width="22" height="84"/>
  </g>
  <g fill="#38e8ff" opacity=".4">
