<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Grid Supply power demand curve">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070814" />
      <stop offset="0.6" stop-color="#150f2a" />
      <stop offset="1" stop-color="#090b1a" />
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c8dff" />
      <stop offset="0.55" stop-color="#b285ff" />
      <stop offset="1" stop-color="#fbbf24" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#b285ff" stroke-opacity="0.09" />
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" />
  <rect width="640" height="400" fill="url(#grid)" />
  <g stroke="#b285ff" stroke-opacity="0.2" fill="none" stroke-width="2">
    <path d="M40 330 H600" />
    <path d="M40 280 H600" />
    <path d="M40 230 H600" />
    <path d="M40 180 H600" />
  </g>
  <path d="M40 300 C90 300 100 210 150 210 C200 210 210 260 260 260 C320 260 330 150 390 150 C450 150 460 230 510 230 C560 230 570 190 600 190" stroke="url(#wave)" stroke-width="6" fill="none" filter="url(#glow)" />
  <g fill="#4c8dff" filter="url(#glow)">
    <circle cx="150" cy="210" r="6" />
    <circle cx="260" cy="260" r="6" />
    <circle cx="390" cy="150" r="6" />
    <circle cx="510" cy="230" r="6" />
  </g>
  <g transform="translate(70 90)" filter="url(#glow)">
    <rect x="0" y="0" width="70" height="80" rx="12" fill="#1a1640" stroke="#b285ff" stroke-opacity="0.5" />
    <path d="M35 12 L18 44 H33 L28 68 L50 34 H36 Z" fill="#fbbf24" />
  </g>
  <g transform="translate(500 80)" filter="url(#glow)">
    <rect x="0" y="0" width="90" height="70" rx="12" fill="#101b33" stroke="#4c8dff" stroke-opacity="0.5" />
    <path d="M45 12 V54 M18 33 H72" stroke="#9cc0ff" stroke-width="8" stroke-linecap="round" />
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="44" fill="#f3eaff" font-size="30" font-weight="700">Grid Supply</text>
    <text x="40" y="68" fill="#a99ac9" font-size="12" letter-spacing="2.4">DISPATCH · DEMAND · RELIABILITY</text>
    <g fill="#b285ff" font-size="11" letter-spacing="1.2">
      <text x="470" y="352">CAPACITY 190 MW</text>
    </g>
  </g>
</svg>
