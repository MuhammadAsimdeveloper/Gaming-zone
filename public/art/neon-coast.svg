  <g transform="translate(34 356)" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" letter-spacing="1.8" fill="#93b3c9">
    <circle cx="-6" cy="-4" r="4" fill="#7ef0c1"/><text x="4" y="0">ON FOOT</text>
    <circle cx="-6" cy="16" r="4" fill="#ffb35c"/><text x="4" y="20">MISSION MARKER</text>
    <circle cx="-6" cy="36" r="4" fill="#ff8f70"/><text x="4" y="40">TRAFFIC</text>
