    <rect x="38" y="-34" width="8" height="68" fill="#0b1526" stroke="#38e8ff" stroke-width="1.6"/>
    <rect x="-46" y="-34" width="92" height="10" fill="#0b1526" stroke="#38e8ff" stroke-width="1.6"/>
    <g fill="#eaf6ff">
      <rect x="-38" y="-32" width="9" height="6"/>
      <rect x="-20" y="-32" width="9" height="6"/>
      <rect x="-2" y="-32" width="9" height="6"/>
      <rect x="16" y="-32" width="9" height="6"/>
      <rect x="34" y="-32" width="9" height="6"/>
    </g>
    <rect x="-40" y="-20" width="80" height="6" fill="#38e8ff" opacity="0.6"/>
  </g>

  <g transform="translate(352 372) rotate(18)">
    <ellipse cx="0" cy="10" rx="34" ry="8" fill="#000" opacity="0.4"/>
    <path d="M-32 2 L20 2 L30 -8 L12 -8 L-2 -18 L-20 -18 L-24 -8 L-34 -8 Z" fill="url(#attCar)"/>
    <rect x="-20" y="-16" width="14" height="6" rx="2" fill="#dff7ff" opacity="0.85"/>
    <circle cx="-22" cy="6" r="7" fill="#050b14" stroke="#38e8ff" stroke-width="2"/>
    <circle cx="22" cy="6" r="7" fill="#050b14" stroke="#38e8ff" stroke-width="2"/>
    <rect x="-38" y="2" width="8" height="3" fill="#9ff3ff" filter="url(#attGlow)"/>
