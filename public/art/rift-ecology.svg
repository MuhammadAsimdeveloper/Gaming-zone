<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Rift Ecology key art: a cutaway rift pool with glowing kelp and moss at the seabed, grazing and burrowing creatures among the fronds and two predators circling above, linked by a food-web diagram">
  <defs>
    <linearGradient id="re-water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#071a2b"/><stop offset=".55" stop-color="#0a2233"/><stop offset="1" stop-color="#0c2b2b"/></linearGradient>
    <linearGradient id="re-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#163a37"/><stop offset="1" stop-color="#0a1c1d"/></linearGradient>
