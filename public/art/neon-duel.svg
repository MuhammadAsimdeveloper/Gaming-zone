<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Neon Duel arcade fighting key art: two neon fighters squaring off on a rain-slick rooftop ring beneath a purple skyline, with health bars above them">
  <defs>
    <linearGradient id="duel-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#060818"/><stop offset=".55" stop-color="#14102c"/><stop offset="1" stop-color="#2a1440"/></linearGradient>
    <linearGradient id="duel-floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a1838"/><stop offset="1" stop-color="#080a18"/></linearGradient>
    <linearGradient id="duel-left" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7fe6ff"/><stop offset="1" stop-color="#38a8d8"/></linearGradient>
    <linearGradient id="duel-right" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ff9d7a"/><stop offset="1" stop-color="#e05a4a"/></linearGradient>
    <radialGradient id="duel-haze" cx=".5" cy=".42" r=".62"><stop offset="0" stop-color="#a06bff" stop-opacity=".28"/><stop offset="1" stop-color="#a06bff" stop-opacity="0"/></radialGradient>
    <filter id="duel-glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="6" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="duel-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="2"/></filter>
  </defs>

  <rect width="640" height="400" fill="url(#duel-sky)"/>
