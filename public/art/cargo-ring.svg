<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Cargo Ring freight routes">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#050814"/><stop offset="1" stop-color="#071b18"/></linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4ade9d"/><stop offset="1" stop-color="#4c8dff"/></linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <g fill="#eaffff"><circle cx="70" cy="50" r="1.4" opacity=".7"/><circle cx="220" cy="40" r="1" opacity=".5"/><circle cx="540" cy="60" r="1.3" opacity=".7"/></g>
  <g fill="none" stroke="url(#route)" stroke-width="6" filter="url(#g)">
    <path d="M80 300 C180 300 180 160 300 160 C420 160 420 300 560 300"/>
    <path d="M80 180 C200 180 220 300 360 300 C480 300 500 180 580 180" stroke="#b285ff" stroke-opacity=".8" stroke-width="4"/>
  </g>
  <g fill="#0b1a2c" stroke="#4ade9d" stroke-width="2">
    <rect x="70" y="280" width="38" height="24" rx="4"/><rect x="280" y="140" width="38" height="24" rx="4"/><rect x="540" y="280" width="38" height="24" rx="4"/>
  </g>
  <g fill="#4ade9d"><circle cx="80" cy="292" r="3"/><circle cx="290" cy="152" r="3"/><circle cx="550" cy="292" r="3"/></g>
  <g filter="url(#g)">
    <rect x="230" y="250" width="180" height="56" rx="10" fill="#0d1930" stroke="#4c8dff" stroke-opacity=".5"/>
    <rect x="250" y="262" width="40" height="32" rx="4" fill="#4c8dff" opacity=".7"/><rect x="300" y="262" width="40" height="32" rx="4" fill="#4ade9d" opacity=".6"/><rect x="350" y="262" width="40" height="32" rx="4" fill="#9cc0ff" opacity=".5"/>
    <circle cx="260" cy="306" r="7" fill="#07101c" stroke="#9cc0ff" stroke-width="2"/><circle cx="380" cy="306" r="7" fill="#07101c" stroke="#9cc0ff" stroke-width="2"/>
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="46" fill="#eaffff" font-size="30" font-weight="700">Cargo Ring</text>
    <text x="40" y="70" fill="#8eb7a8" font-size="12" letter-spacing="2.4">THREE LANES · ONE DEPOT</text>
    <text x="450" y="352" fill="#4ade9d" font-size="11" letter-spacing="1.2">FLEET 06</text>
  </g>
</svg>
