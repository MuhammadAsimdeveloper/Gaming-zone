<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Rift Transit night bus map">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050814" />
      <stop offset="0.55" stop-color="#071323" />
      <stop offset="1" stop-color="#0a1d33" />
    </linearGradient>
    <linearGradient id="lineA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4c8dff" />
      <stop offset="1" stop-color="#4ade9d" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="b" />
      <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#4c8dff" stroke-opacity="0.08" />
    </pattern>
  </defs>
  <rect width="640" height="400" fill="url(#bg)" />
  <rect width="640" height="400" fill="url(#grid)" />
  <g stroke="#4c8dff" stroke-opacity="0.22" stroke-width="6" fill="none">
    <path d="M40 120 H600" />
    <path d="M40 220 H600" />
    <path d="M40 320 H600" />
    <path d="M150 60 V350" />
    <path d="M330 60 V350" />
    <path d="M500 60 V350" />
  </g>
  <g filter="url(#glow)">
    <path d="M60 320 C150 320 150 220 250 220 C350 220 350 120 460 120 C540 120 550 90 590 90" stroke="url(#lineA)" stroke-width="8" fill="none" stroke-linecap="round" />
    <path d="M80 120 C180 120 200 220 300 220 C400 220 420 320 520 320" stroke="#b285ff" stroke-width="6" fill="none" stroke-linecap="round" stroke-opacity="0.9" />
    <circle cx="150" cy="220" r="9" fill="#eaffff" />
    <circle cx="330" cy="220" r="9" fill="#eaffff" />
    <circle cx="460" cy="120" r="9" fill="#eaffff" />
    <circle cx="500" cy="320" r="9" fill="#eaffff" />
  </g>
  <g transform="translate(250 165)" filter="url(#glow)">
    <rect x="0" y="0" width="92" height="46" rx="12" fill="#4c8dff" />
    <rect x="8" y="8" width="76" height="18" rx="5" fill="#dff2ff" />
    <circle cx="20" cy="46" r="8" fill="#0a1122" stroke="#9cc0ff" stroke-width="3" />
    <circle cx="72" cy="46" r="8" fill="#0a1122" stroke="#9cc0ff" stroke-width="3" />
  </g>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="52" fill="#eaffff" font-size="30" font-weight="700">Rift Transit</text>
    <text x="40" y="76" fill="#8ea9c9" font-size="12" letter-spacing="2.4">THREE LINES · ONE FLEET</text>
    <g fill="#9cc0ff" font-size="11" letter-spacing="1.2">
      <text x="470" y="52">SERVICE</text>
      <text x="470" y="72" fill="#eaffff" font-size="18" font-weight="600">87%</text>
    </g>
  </g>
</svg>
