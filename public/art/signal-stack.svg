<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-label="Signal Stack neon tower">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080512"/><stop offset="1" stop-color="#170d2b"/></linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#b285ff"/><stop offset="1" stop-color="#4c8dff"/></linearGradient>
    <filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="640" height="400" fill="url(#bg)"/>
  <g fill="#f2eaff"><circle cx="80" cy="54" r="1.4" opacity=".7"/><circle cx="240" cy="38" r="1" opacity=".5"/><circle cx="560" cy="62" r="1.3" opacity=".6"/></g>
  <circle cx="320" cy="120" r="150" fill="#b285ff" opacity=".06"/>
  <g filter="url(#g)">
    <rect x="190" y="320" width="260" height="22" rx="4" fill="url(#bar)"/>
    <rect x="210" y="294" width="220" height="22" rx="4" fill="url(#bar)" opacity=".9"/>
    <rect x="228" y="268" width="184" height="22" rx="4" fill="url(#bar)" opacity=".8"/>
    <rect x="248" y="242" width="144" height="22" rx="4" fill="url(#bar)" opacity=".7"/>
    <rect x="266" y="216" width="108" height="22" rx="4" fill="url(#bar)" opacity=".6"/>
    <rect x="282" y="190" width="76" height="22" rx="4" fill="url(#bar)" opacity=".5"/>
    <rect x="300" y="164" width="48" height="22" rx="4" fill="#4ade9d" opacity=".8"/>
  </g>
  <rect x="160" y="92" width="120" height="20" rx="4" fill="#4ade9d" opacity=".8" filter="url(#g)"/>
  <path d="M220 112 V152" stroke="#4ade9d" stroke-opacity=".35" stroke-dasharray="4 6"/>
  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="40" y="46" fill="#f5ecff" font-size="30" font-weight="700">Signal Stack</text>
