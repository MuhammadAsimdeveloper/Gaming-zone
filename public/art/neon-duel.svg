      <path d="M-4 -42 L8 4 L18 34" stroke-width="10"/>
      <path d="M-10 -96 L-2 -44" stroke-width="15"/>
      <path d="M-6 -88 L-44 -74 L-62 -58" stroke-width="8"/>
      <path d="M-2 -90 L36 -100 L58 -92" stroke-width="8"/>
    </g>
    <circle cx="0" cy="-112" r="13" fill="url(#duel-left)"/>
