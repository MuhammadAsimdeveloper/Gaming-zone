    <circle cx="560" cy="48" r="1.2" opacity="0.7" />
    <circle cx="600" cy="150" r="1.6" opacity="0.6" />
    <circle cx="120" cy="170" r="1" opacity="0.5" />
  </g>
  <circle cx="470" cy="230" r="92" fill="url(#planet)" />
  <ellipse cx="470" cy="240" rx="150" ry="34" fill="none" stroke="url(#ring)" stroke-width="5" opacity="0.65" transform="rotate(-14 470 240)" filter="url(#glow)" />
  <g filter="url(#glow)">
    <circle cx="180" cy="190" r="34" fill="#0d1930" stroke="#b285ff" stroke-width="2" />
    <circle cx="180" cy="190" r="13" fill="#b285ff" fill-opacity="0.35" />
    <path d="M146 190 H214" stroke="#b285ff" stroke-width="5" opacity="0.6" />
    <circle cx="320" cy="120" r="18" fill="#0d1930" stroke="#4c8dff" stroke-width="2" />
